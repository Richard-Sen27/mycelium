version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
  settings:
    gosec:
      excludes:
        - G304 # file inclusion via variable: paths are our own data dirs
  exclusions:
    paths:
      - gen/
formatters:
  enable:
    - gofmt
    - goimports
