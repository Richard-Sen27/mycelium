syntax = "proto3";

package mycel.v1;

import "mycel/v1/common.proto";
import "mycel/v1/envelope.proto";
import "mycel/v1/grant.proto";
import "mycel/v1/job.proto";

message Gpu {
  int32 index = 1;
  string vendor = 2; // nvidia, amd, apple, intel
  string model = 3;
  uint64 vram_bytes = 4;
  string driver = 5;
}

message ToolPresence {
  bool present = 1;
  string version = 2;
  string path = 3;
}

// Inventory is what a node reports about itself.
message Inventory {
  string os = 1; // darwin, windows, linux
  string arch = 2; // arm64, amd64
  string hostname = 3;
  string os_version = 4;
  int32 cpu_count = 5;
  string cpu_model = 6;
  uint64 mem_bytes = 7;
  repeated Gpu gpus = 8;
  ToolPresence docker = 9;
  ToolPresence ollama = 10;
  repeated string sandbox_backends = 11; // e.g. applevf, wsl2-gvisor, gvisor, firecracker, fake
  string mycel_version = 12;
  string probed_at = 13;
}

// Node is the hub's view of an enrolled machine.
message Node {
  string id = 1; // "node:<name>"
  string name = 2;
  string spiffe_id = 3;
  string owner_id = 4;
  Capabilities caps_ceiling = 5; // pinned by the join token
  Capabilities caps_enabled = 6; // what the owner has switched on, subset of ceiling
  Inventory inventory = 7;
  bool online = 8;
  string last_seen_at = 9;
  string cert_serial = 10;
  string cert_not_after = 11;
  string created_at = 12;
}

// ---- Bus messages (node <-> hub over NATS) ----

// Published by a node on node.<name>.telemetry every few seconds.
message Heartbeat {
  string node_name = 1;
  Inventory inventory = 2; // full inventory on first beat and when it changes; may be empty otherwise
  string inventory_hash = 3;
  uint64 uptime_seconds = 4;
  string sent_at = 5;
  // Phase 6: the egress proxy's records since the last batch (at most 256
  // per message, at most one batch per second per node), for the hub's
  // audit log. Metadata only, never bodies.
  repeated EgressRecord egress = 6;
  uint64 egress_dropped = 7; // records the node dropped since the last batch (backlog over 4096)
}

// Connections or requests through a node's egress proxy: one record, or
// several with the same sandbox, host, port, method and verdict within one
// batch window (count, summed bytes).
message EgressRecord {
  string sandbox_id = 1; // empty when unauthenticated
  string job_id = 2; // empty for a sandbox that does not run a job, and when unauthenticated
  string host = 3;
  uint32 port = 4;
  bool allowed = 5;
  string method = 6; // "CONNECT" or the HTTP method
  uint64 bytes_in = 7;
  uint64 bytes_out = 8;
  uint64 count = 9; // connections this record stands for; 0 means 1
  // The request failed proxy authentication: the sandbox it claimed is not
  // trusted, so the record is bound to no sandbox and no job.
  bool unauthenticated = 10;
}

// Sent by the hub to node.<name>.ctl as a request; the node replies with CtlResponse.
message CtlRequest {
  oneof cmd {
    Ping ping = 1;
    Revoked revoked = 2; // the node must stop and forget its identity
    SetCaps set_caps = 3;
    Shutdown shutdown = 4;
    AgentCtl agent = 5; // phase 3: pause, resume or stop one local agent
    CreateSandbox create_sandbox = 6; // phase 4: run a job
    KillSandbox kill_sandbox = 7; // phase 4: cancel a job
    AttachGrant attach_grant = 8; // phase 5
    DetachGrant detach_grant = 9; // phase 5
    Freeze freeze = 10; // phase 5
    Unfreeze unfreeze = 11; // phase 5
    SharingSettings sharing = 12; // phase 5: the owner's hub-side settings changed
    Redirect redirect = 13; // phase 7: the hub moved; follow after verifying the signature
  }
}

// Redirect tells a node (or a CLI, in the Mycel-Redirect response header)
// that the hub now lives elsewhere. signature is the CA key's signature
// over identity.RedirectPayload (see internal/hub/moving.go); receivers
// verify it against the CA they pinned at join and ignore redirects older
// than one they already followed.
message Redirect {
  string trust_domain = 1;
  string hub_url = 2; // https://host:port
  string bus_url = 3; // host:port
  int64 issued_at = 4; // unix seconds
  bytes signature = 5;
}

// AgentCtl is sent by the hub when an agent is paused (budget exhausted,
// kill switch), resumed or stopped. The node applies it to the local worker
// process and to the agent's local session.
message AgentCtl {
  string agent_id = 1;
  string action = 2; // "pause", "resume", "stop"
  string reason = 3;
}

// Ping asks for a full heartbeat: the hub does not hold the inventory
// behind the hash the node's beats carry. The node answers Ok and sends
// the inventory with its next beat.
message Ping {}

message Revoked {
  string reason = 1;
}

message SetCaps {
  Capabilities caps_enabled = 1;
}

message Shutdown {
  string reason = 1;
}

message CtlResponse {
  bool ok = 1;
  string error = 2;
}

// Node-originated RPCs are published on node.<name>.rpc.<method> with a reply
// subject. The hub derives the node name from the subject, never from the
// payload.

message RegisterAgentRequest {
  string agent_name = 1;
  string sandbox_id = 2; // empty for trusted-host agents
  string harness = 3;
  // Phase 3: set when the agent was spawned by another agent on this node.
  string parent = 4; // "agent:<name>@<node>" of the spawner, empty for orchestrators
  string home_channel = 5; // channel the worker was spawned for; its usage counts there
  Budget budget = 6; // per-agent ceiling; zero = unlimited
  string workdir = 7; // informational
}

// Phase 3: usage and lifecycle reports from the node (node.<n>.rpc.agent.usage / agent.exited).

message AgentUsageRequest {
  string agent_id = 1;
  int64 tokens = 2; // increment since the last report
  double usd = 3; // increment since the last report
  int32 turns = 4; // increment
}

message AgentUsageResponse {
  Budget agent_remaining = 1; // negative numbers mean exhausted
  Budget channel_remaining = 2;
  bool paused = 3; // the hub paused the agent (budget exhausted or kill switch)
}

message AgentExitedRequest {
  string agent_id = 1;
  int32 exit_code = 2;
  string reason = 3; // "finished", "killed", "error: ...", "stopped"
}

message AgentExitedResponse {}

message RegisterAgentResponse {
  string agent_id = 1; // "agent:<name>@<node>"
  string token = 2; // 1h agent token bound to node and sandbox
  string expires_at = 3;
  // Phase 3: the agent's state after registration. A re-registered agent
  // keeps an earlier pause; the node applies it locally at once.
  string state = 4; // running, paused
  string paused_reason = 5; // "budget: agent", "budget: channel", "operator", ""
  bool first_registration = 6; // false when the name was registered before
}

message RefreshAgentTokenRequest {
  string agent_id = 1;
  string token = 2; // current, still-valid token
}

message RefreshAgentTokenResponse {
  string token = 1;
  string expires_at = 2;
}
