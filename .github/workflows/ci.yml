name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The e2e binary embeds the UI (phase 6: the hub and node serve the app).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: go build ./...
      - run: go test ./...
      - run: go test -tags e2e -count=1 -timeout 10m ./test/e2e/...
      # Phase 7: real mDNS advertising and browsing, Linux runners only (on a
      # workstation a responder could disturb the machine's own names; the
      # e2e run above uses the test binary's fake mDNS).
      - name: real mDNS
        if: runner.os == 'Linux'
        env:
          MYCEL_TEST_MDNS: "1"
        run: |
          go test -count=1 -run 'TestBrowseOnly|TestRealMulticast' ./internal/discovery/
          go test -tags e2e -count=1 -timeout 5m -run TestDiscoveryRealMulticast ./test/e2e/...

  # The UI: typecheck, unit tests (including the CLI parity check) and the
  # size budget (initial load under 1 MiB without the 3D chunk; the job
  # fails when it is exceeded).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: make tools
      - run: make gen-check
      - run: buf lint
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # Keeps .goreleaser.yaml valid: one snapshot build for the runner's platform
  # (the before hook builds the web UI). Releases: .github/workflows/release.yml.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - run: shellcheck scripts/install.sh scripts/demo.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target
